<svg viewBox="0 0 680 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LinkX 系统架构总览</title>
  <desc>客户端与管理端双分支，经 REST/WebSocket 双通道接入 linkx-server 单体，落地 MySQL/Redis/MinIO</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font-family:sans-serif;font-size:15px;font-weight:500;fill:#2C2C2A}
      .layer{font-family:sans-serif;font-size:13px;font-weight:500;fill:#185FA5}
      .cardt{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
      .body{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
      .edge{fill:none;stroke:#5F5E5A;stroke-width:1.5}
    </style>
  </defs>
  <text class="title" x="350" y="28" text-anchor="middle">LinkX 系统架构总览 · 客户端 / 管理端双分支</text>

  <rect x="40" y="44" width="600" height="128" rx="14" fill="#EEF4FB" stroke="#B5D4F4" stroke-width="0.5"/>
  <text class="layer" x="56" y="66">L1 · 展现层</text>
  <line x1="180" y1="56" x2="180" y2="160" stroke="#B5D4F4" stroke-width="0.5"/>
  <g>
    <rect x="196" y="62" width="216" height="96" rx="10" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.8"/>
    <text class="cardt" x="304" y="86" text-anchor="middle">桌面客户端</text>
    <text class="body" x="304" y="110" text-anchor="middle">Electron 主进程 + Vue3 渲染</text>
    <text class="body" x="304" y="130" text-anchor="middle">Pinia · Naive UI · UnoCSS</text>
    <text class="body" x="304" y="150" text-anchor="middle">--lx-* Token · i18n</text>
  </g>
  <g>
    <rect x="428" y="62" width="216" height="96" rx="10" fill="#FFFFFF" stroke="#639922" stroke-width="0.8"/>
    <text class="cardt" x="536" y="86" text-anchor="middle">运营管理后台</text>
    <text class="body" x="536" y="110" text-anchor="middle">Vue3 + Vite8 · ECharts</text>
    <text class="body" x="536" y="130" text-anchor="middle">vue-i18n · RBAC</text>
    <text class="body" x="536" y="150" text-anchor="middle">风控审核 · BI · 监控</text>
  </g>

  <rect x="40" y="188" width="600" height="92" rx="14" fill="#EAF6F1" stroke="#9FE1CB" stroke-width="0.5"/>
  <text class="layer" x="56" y="210" fill="#0F6E56">L2 · 接入层（双通道）</text>
  <line x1="180" y1="200" x2="180" y2="268" stroke="#9FE1CB" stroke-width="0.5"/>
  <g>
    <rect x="196" y="204" width="216" height="60" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.8"/>
    <text class="cardt" x="304" y="228" text-anchor="middle">REST API</text>
    <text class="body" x="304" y="248" text-anchor="middle">:8080/api</text>
  </g>
  <g>
    <rect x="428" y="204" width="216" height="60" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.8"/>
    <text class="cardt" x="536" y="228" text-anchor="middle">WebSocket</text>
    <text class="body" x="536" y="248" text-anchor="middle">:8081/ws（Netty）</text>
  </g>

  <rect x="40" y="300" width="600" height="92" rx="14" fill="#FBF3E6" stroke="#FAC775" stroke-width="0.5"/>
  <text class="layer" x="56" y="322" fill="#854F0B">L3 · 服务层</text>
  <line x1="180" y1="312" x2="180" y2="380" stroke="#FAC775" stroke-width="0.5"/>
  <g>
    <rect x="196" y="310" width="448" height="72" rx="10" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.8"/>
    <text class="cardt" x="420" y="334" text-anchor="middle">linkx-server 单体（双端共用 Service/Entity/Mapper）</text>
    <text class="body" x="420" y="356" text-anchor="middle">认证鉴权(JWT双Token) · IM · 好友群组 · 红包 · 会议 · 网盘</text>
    <text class="body" x="420" y="376" text-anchor="middle">朋友圈/日历 · 审计/风控 · Flyway 迁移</text>
  </g>

  <rect x="40" y="412" width="600" height="96" rx="14" fill="#FCEFEF" stroke="#F7C1C1" stroke-width="0.5"/>
  <text class="layer" x="56" y="434" fill="#993C1D">L4 · 数据层</text>
  <line x1="180" y1="424" x2="180" y2="496" stroke="#F7C1C1" stroke-width="0.5"/>
  <g>
    <rect x="196" y="428" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#D4537E" stroke-width="0.8"/>
    <text class="cardt" x="266" y="456" text-anchor="middle">MySQL</text>
    <text class="body" x="266" y="476" text-anchor="middle">8.4</text>
  </g>
  <g>
    <rect x="352" y="428" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#D4537E" stroke-width="0.8"/>
    <text class="cardt" x="422" y="456" text-anchor="middle">Redis</text>
    <text class="body" x="422" y="476" text-anchor="middle">7.2</text>
  </g>
  <g>
    <rect x="508" y="428" width="124" height="64" rx="10" fill="#FFFFFF" stroke="#D4537E" stroke-width="0.8"/>
    <text class="cardt" x="570" y="456" text-anchor="middle">MinIO</text>
    <text class="body" x="570" y="476" text-anchor="middle">对象存储</text>
  </g>

  <line class="edge" x1="304" y1="158" x2="304" y2="188" marker-end="url(#arrow)"/>
  <line class="edge" x1="536" y1="158" x2="536" y2="188" marker-end="url(#arrow)"/>
  <line class="edge" x1="350" y1="280" x2="350" y2="300" marker-end="url(#arrow)"/>
  <line class="edge" x1="350" y1="392" x2="350" y2="412" marker-end="url(#arrow)"/>
</svg>
