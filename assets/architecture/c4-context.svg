<svg viewBox="0 0 680 470" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LinkX C4 系统上下文图（Level 1）</title>
  <desc>LinkX 系统与其用户（终端用户、运营管理员）及外部系统（官网、邮件服务）的关系</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font-family:sans-serif;font-size:15px;font-weight:500;fill:#2C2C2A}
      .pl{font-family:sans-serif;font-size:13px;font-weight:500;fill:#FFFFFF}
      .ps{font-family:sans-serif;font-size:11px;fill:#EAF1F8}
      .bl{font-family:sans-serif;font-size:13px;font-weight:500;fill:#1168BD}
      .sl{font-family:sans-serif;font-size:14px;font-weight:500;fill:#FFFFFF}
      .ss{font-family:sans-serif;font-size:11px;fill:#EAF1F8}
      .el{font-family:sans-serif;font-size:13px;font-weight:500;fill:#FFFFFF}
      .es{font-family:sans-serif;font-size:10px;fill:#F1F1F1}
      .rl{font-family:sans-serif;font-size:12px;fill:#2C2C2A}
      .leg{font-family:sans-serif;font-size:11px;fill:#5F5E5A}
      .edge{fill:none;stroke:#5F5E5A;stroke-width:1.5}
    </style>
  </defs>
  <text class="title" x="350" y="26" text-anchor="middle">LinkX C4 系统上下文图（Level 1）</text>

  <g>
    <rect x="40" y="90" width="150" height="76" rx="10" fill="#1168BD"/>
    <circle cx="72" cy="120" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M60 150 C60 134 84 134 84 150" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text class="pl" x="100" y="118">终端用户</text>
    <text class="ps" x="100" y="138">手机 / PC 用户</text>
  </g>
  <g>
    <rect x="40" y="220" width="150" height="76" rx="10" fill="#1168BD"/>
    <circle cx="72" cy="250" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M60 280 C60 264 84 264 84 280" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text class="pl" x="100" y="248">运营管理员</text>
    <text class="ps" x="100" y="268">后台运营 / 风控</text>
  </g>

  <rect x="250" y="70" width="320" height="300" rx="12" fill="#EAF1F8" stroke="#438DD5" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="bl" x="268" y="90">LinkX 系统边界</text>
  <rect x="300" y="150" width="220" height="120" rx="10" fill="#438DD5"/>
  <text class="sl" x="410" y="195" text-anchor="middle">LinkX 核心系统</text>
  <text class="ss" x="410" y="218" text-anchor="middle">即时通讯 · 协同 · 运营 · 风控</text>
  <text class="ss" x="410" y="238" text-anchor="middle">Spring Boot 3.5 + Netty</text>

  <g>
    <rect x="600" y="100" width="80" height="70" rx="10" fill="#9AA0A6"/>
    <text class="el" x="640" y="130" text-anchor="middle">官网</text>
    <text class="es" x="640" y="148" text-anchor="middle">mars-studio</text>
  </g>
  <g>
    <rect x="600" y="240" width="80" height="70" rx="10" fill="#9AA0A6"/>
    <text class="el" x="640" y="270" text-anchor="middle">邮件服务</text>
    <text class="es" x="640" y="288" text-anchor="middle">SMTP</text>
  </g>

  <line class="edge" x1="190" y1="150" x2="300" y2="195" marker-end="url(#arrow)"/>
  <text class="rl" x="232" y="168" text-anchor="middle">① 使用客户端</text>
  <line class="edge" x1="190" y1="280" x2="300" y2="240" marker-end="url(#arrow)"/>
  <text class="rl" x="232" y="262" text-anchor="middle">② 运营/风控</text>
  <line class="edge" x1="520" y1="170" x2="600" y2="135" marker-end="url(#arrow)"/>
  <text class="rl" x="556" y="148" text-anchor="middle">③ 托管静态页</text>
  <line class="edge" x1="520" y1="230" x2="600" y2="255" marker-end="url(#arrow)"/>
  <text class="rl" x="556" y="248" text-anchor="middle">④ 发验证码</text>

  <rect x="250" y="388" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#C9C9C9" stroke-width="0.5"/>
  <rect x="266" y="402" width="14" height="14" rx="3" fill="#1168BD"/>
  <text class="leg" x="286" y="414">用户</text>
  <rect x="336" y="402" width="14" height="14" rx="3" fill="#438DD5"/>
  <text class="leg" x="356" y="414">本系统</text>
  <rect x="426" y="402" width="14" height="14" rx="3" fill="#9AA0A6"/>
  <text class="leg" x="446" y="414">外部系统</text>
  <text class="leg" x="266" y="438">实线 = 使用 / 依赖关系</text>
</svg>
