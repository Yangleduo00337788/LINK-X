<svg viewBox="0 0 680 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Netty WebSocket 集群推送（Redis Stream）时序图</title>
  <desc>Client A 经实例1 Netty 发送消息，实例1 持久化后 XADD 到 Redis Stream，实例2 订阅消费并本机投递给 Client B，离线走游标同步</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font-family:sans-serif;font-size:15px;font-weight:500;fill:#2C2C2A}
      .pname{font-family:sans-serif;font-size:13px;font-weight:500;fill:#2C2C2A}
      .psub{font-family:sans-serif;font-size:11px;fill:#5F5E5A}
      .lbl{font-family:sans-serif;font-size:13px;fill:#2C2C2A}
      .note{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
      .edge{fill:none;stroke:#5F5E5A;stroke-width:1.5}
      .life{stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
    </style>
  </defs>
  <text class="title" x="350" y="26" text-anchor="middle">Netty WebSocket 集群推送（Redis Stream）时序</text>

  <g>
    <rect x="45" y="50" width="110" height="46" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="pname" x="100" y="74" text-anchor="middle">Client A</text>
    <text class="psub" x="100" y="90" text-anchor="middle">发送端</text>
  </g>
  <g>
    <rect x="165" y="50" width="110" height="46" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text class="pname" x="220" y="74" text-anchor="middle">实例1</text>
    <text class="psub" x="220" y="90" text-anchor="middle">Netty+Push</text>
  </g>
  <g>
    <rect x="285" y="50" width="110" height="46" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
    <text class="pname" x="340" y="74" text-anchor="middle">Redis Stream</text>
  </g>
  <g>
    <rect x="405" y="50" width="110" height="46" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text class="pname" x="460" y="74" text-anchor="middle">实例2</text>
    <text class="psub" x="460" y="90" text-anchor="middle">Netty</text>
  </g>
  <g>
    <rect x="525" y="50" width="110" height="46" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="pname" x="580" y="74" text-anchor="middle">Client B</text>
    <text class="psub" x="580" y="90" text-anchor="middle">接收端</text>
  </g>

  <line class="life" x1="100" y1="96" x2="100" y2="470"/>
  <line class="life" x1="220" y1="96" x2="220" y2="470"/>
  <line class="life" x1="340" y1="96" x2="340" y2="470"/>
  <line class="life" x1="460" y1="96" x2="460" y2="470"/>
  <line class="life" x1="580" y1="96" x2="580" y2="470"/>

  <line class="edge" x1="100" y1="138" x2="218" y2="138" marker-end="url(#arrow)"/>
  <text class="lbl" x="159" y="130" text-anchor="middle">① 发送消息 (ws send)</text>

  <rect x="143" y="164" width="154" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="note" x="220" y="181" text-anchor="middle">② 风暴检测 + 持久化</text>

  <line class="edge" x1="220" y1="222" x2="338" y2="222" marker-end="url(#arrow)"/>
  <text class="lbl" x="279" y="214" text-anchor="middle">③ XADD 广播</text>

  <line class="edge" x1="340" y1="260" x2="458" y2="260" marker-end="url(#arrow)"/>
  <text class="lbl" x="399" y="252" text-anchor="middle">④ 投递订阅者</text>

  <rect x="383" y="286" width="154" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="note" x="460" y="303" text-anchor="middle">⑤ 查本机在线通道</text>

  <line class="edge" x1="460" y1="344" x2="578" y2="344" marker-end="url(#arrow)"/>
  <text class="lbl" x="519" y="336" text-anchor="middle">⑥ 下发 WS 帧</text>

  <line class="edge" x1="580" y1="382" x2="462" y2="382" marker-end="url(#arrow)"/>
  <text class="lbl" x="521" y="374" text-anchor="middle">⑦ ACK 回执</text>

  <rect x="60" y="412" width="560" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="note" x="72" y="434">⑧ 离线分支：Client B 离线时写入离线游标，重连后通过 sync 按雪花 id 拉取历史</text>
  <text class="note" x="72" y="456">Redis Stream 替代 Pub/Sub 支持断线续读；clientMsgId 去重防止重复投递</text>
</svg>
