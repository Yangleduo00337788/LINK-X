<svg viewBox="0 0 680 390" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LinkX C4 容器图（Level 2）</title>
  <desc>终端用户 / 运营管理员 通过桌面客户端与管理后台访问 Spring Boot + Netty 后端服务，后端服务依赖 MySQL、Redis、MinIO</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font-family:sans-serif;font-size:15px;font-weight:500;fill:#2C2C2A}
      .pl{font-family:sans-serif;font-size:13px;font-weight:500;fill:#FFFFFF}
      .ps{font-family:sans-serif;font-size:10px;fill:#EAF1F8}
      .al{font-family:sans-serif;font-size:14px;font-weight:500;fill:#FFFFFF}
      .as{font-family:sans-serif;font-size:10px;fill:#EAF1F8}
      .bl{font-family:sans-serif;font-size:14px;font-weight:500;fill:#FFFFFF}
      .bs{font-family:sans-serif;font-size:10px;fill:#E6F4EE}
      .rl{font-family:sans-serif;font-size:12px;fill:#2C2C2A}
      .num{font-family:sans-serif;font-size:11px;font-weight:700;fill:#438DD5}
      .leg{font-family:sans-serif;font-size:11px;fill:#5F5E5A}
      .edge{fill:none;stroke:#5F5E5A;stroke-width:1.5}
      .edgeD{fill:none;stroke:#5F5E5A;stroke-width:1.5;stroke-dasharray:5 4}
    </style>
  </defs>
  <text class="title" x="340" y="26" text-anchor="middle">LinkX C4 容器图（Level 2）</text>

  <!-- 用户 -->
  <g>
    <rect x="20" y="110" width="110" height="60" rx="10" fill="#1168BD"/>
    <circle cx="48" cy="140" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M37 167 C37 152 59 152 59 167" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text class="pl" x="76" y="138">终端用户</text>
    <text class="ps" x="76" y="156">手机 / PC</text>
  </g>
  <g>
    <rect x="20" y="270" width="110" height="60" rx="10" fill="#1168BD"/>
    <circle cx="48" cy="300" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M37 327 C37 312 59 312 59 327" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text class="pl" x="76" y="298">运营管理员</text>
    <text class="ps" x="76" y="316">RBAC / 风控</text>
  </g>

  <!-- 应用容器 -->
  <g>
    <rect x="160" y="80" width="140" height="64" rx="10" fill="#438DD5"/>
    <text class="al" x="230" y="112" text-anchor="middle">桌面客户端</text>
    <text class="as" x="230" y="132" text-anchor="middle">Vue3 + Electron</text>
  </g>
  <g>
    <rect x="160" y="240" width="140" height="64" rx="10" fill="#438DD5"/>
    <text class="al" x="230" y="272" text-anchor="middle">管理后台</text>
    <text class="as" x="230" y="292" text-anchor="middle">Vue3 + Vite</text>
  </g>
  <g>
    <rect x="340" y="150" width="160" height="120" rx="10" fill="#438DD5"/>
    <text class="al" x="420" y="190" text-anchor="middle">LinkX 后端服务</text>
    <text class="as" x="420" y="212" text-anchor="middle">Spring Boot 3.5 (JDK 21)</text>
    <text class="as" x="420" y="230" text-anchor="middle">REST :8080</text>
    <text class="as" x="420" y="248" text-anchor="middle">Netty WS :8081</text>
  </g>

  <!-- 数据容器 -->
  <g>
    <rect x="540" y="70" width="120" height="50" rx="10" fill="#1D9E75"/>
    <text class="bl" x="600" y="92" text-anchor="middle">MySQL 8.4</text>
    <text class="bs" x="600" y="110" text-anchor="middle">业务主库</text>
  </g>
  <g>
    <rect x="540" y="150" width="120" height="50" rx="10" fill="#1D9E75"/>
    <text class="bl" x="600" y="172" text-anchor="middle">Redis 7.2</text>
    <text class="bs" x="600" y="190" text-anchor="middle">令牌态 / Stream</text>
  </g>
  <g>
    <rect x="540" y="230" width="120" height="50" rx="10" fill="#1D9E75"/>
    <text class="bl" x="600" y="252" text-anchor="middle">MinIO</text>
    <text class="bs" x="600" y="270" text-anchor="middle">对象存储</text>
  </g>

  <!-- 边：用户 -> 客户端 -->
  <line class="edge" x1="130" y1="140" x2="160" y2="112" marker-end="url(#arrow)"/>
  <text class="rl" x="118" y="118">使用</text>
  <line class="edge" x1="130" y1="300" x2="160" y2="272" marker-end="url(#arrow)"/>
  <text class="rl" x="118" y="278">使用</text>

  <!-- 边：客户端 -> 后端 -->
  <line class="edge" x1="300" y1="112" x2="350" y2="180" marker-end="url(#arrow)"/>
  <text class="num" x="308" y="138">①</text>
  <text class="rl" x="306" y="150">REST :8080</text>
  <line class="edge" x1="300" y1="128" x2="352" y2="200" marker-end="url(#arrow)"/>
  <text class="num" x="316" y="160">②</text>
  <text class="rl" x="316" y="172">WS :8081</text>
  <line class="edge" x1="300" y1="272" x2="350" y2="240" marker-end="url(#arrow)"/>
  <text class="num" x="308" y="252">③</text>
  <text class="rl" x="306" y="264">REST /admin</text>

  <!-- 边：后端 -> 数据 -->
  <line class="edge" x1="500" y1="180" x2="540" y2="92" marker-end="url(#arrow)"/>
  <text class="num" x="508" y="128">④</text>
  <text class="rl" x="506" y="140">JDBC</text>
  <line class="edgeD" x1="500" y1="205" x2="540" y2="172" marker-end="url(#arrowD)"/>
  <text class="num" x="508" y="192">⑤</text>
  <text class="rl" x="506" y="205">Lettuce</text>
  <line class="edge" x1="500" y1="240" x2="540" y2="252" marker-end="url(#arrow)"/>
  <text class="num" x="508" y="248">⑥</text>
  <text class="rl" x="506" y="262">S3</text>

  <!-- 图例 -->
  <rect x="120" y="334" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#C9C9C9" stroke-width="0.5"/>
  <line class="edge" x1="138" y1="354" x2="172" y2="354" marker-end="url(#arrow)"/>
  <text class="leg" x="178" y="358">实线 = 同步调用（REST / WebSocket / JDBC / S3）</text>
  <line class="edgeD" x1="138" y1="368" x2="172" y2="368" marker-end="url(#arrowD)"/>
  <text class="leg" x="178" y="372">虚线 = 异步（Redis Stream 集群广播）</text>
</svg>
