<svg viewBox="0 0 680 620" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LinkX C4 组件图（Level 3）— 后端服务内部</title>
  <desc>后端服务内部：Tomcat REST 与 Netty WS 双入口、自研 LoginInterceptor+JwtUtils 双Token 鉴权、业务服务层、Redis Stream 集群推送、雪花ID、MySQL/Redis/MinIO 依赖</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font-family:sans-serif;font-size:15px;font-weight:500;fill:#2C2C2A}
      .bl{font-family:sans-serif;font-size:13px;font-weight:500;fill:#FFFFFF}
      .bs{font-family:sans-serif;font-size:9px;fill:#E6F4EE}
      .pl{font-family:sans-serif;font-size:13px;font-weight:500;fill:#FFFFFF}
      .ps{font-family:sans-serif;font-size:9px;fill:#EAF1F8}
      .al{font-family:sans-serif;font-size:13px;font-weight:500;fill:#FFFFFF}
      .as{font-family:sans-serif;font-size:9px;fill:#EAF1F8}
      .gl{font-family:sans-serif;font-size:11px;font-weight:500;fill:#438DD5}
      .cl{font-family:sans-serif;font-size:11px;font-weight:500;fill:#2C2C2A}
      .rl{font-family:sans-serif;font-size:11px;fill:#2C2C2A}
      .num{font-family:sans-serif;font-size:10px;font-weight:700;fill:#438DD5}
      .leg{font-family:sans-serif;font-size:11px;fill:#5F5E5A}
      .edge{fill:none;stroke:#5F5E5A;stroke-width:1.4}
      .edgeD{fill:none;stroke:#5F5E5A;stroke-width:1.4;stroke-dasharray:5 4}
    </style>
  </defs>
  <text class="title" x="340" y="26" text-anchor="middle">LinkX C4 组件图（Level 3）— 后端服务内部</text>

  <!-- 外部应用（容器级） -->
  <g>
    <rect x="20" y="110" width="140" height="58" rx="10" fill="#438DD5"/>
    <text class="pl" x="34" y="134">桌面客户端</text>
    <text class="ps" x="34" y="152">Vue3 + Electron</text>
  </g>
  <g>
    <rect x="20" y="300" width="140" height="58" rx="10" fill="#438DD5"/>
    <text class="pl" x="34" y="324">管理后台</text>
    <text class="ps" x="34" y="342">Vue3 + Vite</text>
  </g>

  <!-- 后端服务容器边界 -->
  <rect x="180" y="55" width="490" height="520" rx="12" fill="#EAF1F8" stroke="#438DD5" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="gl" x="196" y="76">LinkX 后端服务（Spring Boot 3.5 单体 · 双端口 8080 / 8081）</text>

  <!-- 接入层 -->
  <g>
    <rect x="210" y="100" width="200" height="58" rx="9" fill="#438DD5"/>
    <text class="al" x="310" y="124" text-anchor="middle">REST 控制器</text>
    <text class="as" x="310" y="142" text-anchor="middle">Tomcat :8080</text>
  </g>
  <g>
    <rect x="210" y="180" width="200" height="58" rx="9" fill="#438DD5"/>
    <text class="al" x="310" y="204" text-anchor="middle">Netty WS 服务</text>
    <text class="as" x="310" y="222" text-anchor="middle">:8081 长连接</text>
  </g>

  <!-- 鉴权横切 -->
  <g>
    <rect x="210" y="270" width="430" height="56" rx="9" fill="#2F6FB0"/>
    <text class="al" x="425" y="294" text-anchor="middle">LoginInterceptor + JwtUtils（双 Token：Access / Refresh）</text>
    <text class="as" x="425" y="314" text-anchor="middle">自研鉴权，未用 Spring Security 过滤器链</text>
  </g>

  <!-- 业务服务层 -->
  <rect x="210" y="360" width="430" height="130" rx="9" fill="#FFFFFF" stroke="#BFD3E8" stroke-width="1"/>
  <text class="gl" x="225" y="380">业务服务层（客户端/管理端共用 Service / Entity / Mapper）</text>
  <g>
    <rect x="222" y="392" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="264" y="416" text-anchor="middle">IM 消息</text>
  </g>
  <g>
    <rect x="316" y="392" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="358" y="416" text-anchor="middle">群组</text>
  </g>
  <g>
    <rect x="410" y="392" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="452" y="416" text-anchor="middle">红包</text>
  </g>
  <g>
    <rect x="504" y="392" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="546" y="416" text-anchor="middle">会议</text>
  </g>
  <g>
    <rect x="222" y="446" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="264" y="470" text-anchor="middle">文件</text>
  </g>
  <g>
    <rect x="316" y="446" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="358" y="470" text-anchor="middle">社交</text>
  </g>
  <g>
    <rect x="410" y="446" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="452" y="470" text-anchor="middle">风控</text>
  </g>
  <g>
    <rect x="504" y="446" width="84" height="42" rx="7" fill="#EAF1F8" stroke="#BFD3E8"/>
    <text class="cl" x="546" y="470" text-anchor="middle">雪花ID</text>
  </g>

  <!-- 基础设施依赖 -->
  <g>
    <rect x="210" y="520" width="120" height="50" rx="9" fill="#1D9E75"/>
    <text class="bl" x="270" y="542" text-anchor="middle">MySQL 8.4</text>
    <text class="bs" x="270" y="560" text-anchor="middle">JDBC</text>
  </g>
  <g>
    <rect x="345" y="520" width="150" height="50" rx="9" fill="#1D9E75"/>
    <text class="bl" x="420" y="542" text-anchor="middle">Redis Stream</text>
    <text class="bs" x="420" y="560" text-anchor="middle">集群推送广播</text>
  </g>
  <g>
    <rect x="510" y="520" width="80" height="50" rx="9" fill="#1D9E75"/>
    <text class="bl" x="550" y="542" text-anchor="middle">令牌态</text>
    <text class="bs" x="550" y="560" text-anchor="middle">Redis</text>
  </g>
  <g>
    <rect x="600" y="520" width="68" height="50" rx="9" fill="#1D9E75"/>
    <text class="bl" x="634" y="542" text-anchor="middle">MinIO</text>
    <text class="bs" x="634" y="560" text-anchor="middle">S3</text>
  </g>

  <!-- 边：外部 -> 接入层 -->
  <line class="edge" x1="160" y1="139" x2="210" y2="129" marker-end="url(#arrow)"/>
  <text class="num" x="166" y="124">①</text>
  <text class="rl" x="164" y="134">REST :8080</text>
  <line class="edge" x1="160" y1="150" x2="210" y2="209" marker-end="url(#arrow)"/>
  <text class="num" x="166" y="178">②</text>
  <text class="rl" x="164" y="190">WS :8081</text>
  <line class="edge" x1="160" y1="329" x2="210" y2="129" marker-end="url(#arrow)"/>
  <text class="num" x="170" y="220">③</text>
  <text class="rl" x="168" y="232">REST /admin</text>

  <!-- 边：接入层 -> 鉴权 -->
  <line class="edge" x1="360" y1="158" x2="360" y2="270" marker-end="url(#arrow)"/>
  <text class="rl" x="366" y="216">鉴权</text>
  <line class="edge" x1="360" y1="238" x2="360" y2="270" marker-end="url(#arrow)"/>
  <text class="rl" x="366" y="262">握手</text>

  <!-- 边：鉴权 -> 业务服务层 -->
  <line class="edge" x1="425" y1="326" x2="425" y2="360" marker-end="url(#arrow)"/>
  <text class="rl" x="431" y="350">横切</text>

  <!-- 边：业务服务层 -> 基础设施 -->
  <line class="edge" x1="270" y1="490" x2="270" y2="520" marker-end="url(#arrow)"/>
  <text class="num" x="226" y="510">④</text>
  <text class="rl" x="224" y="500">JDBC</text>
  <line class="edgeD" x1="420" y1="490" x2="420" y2="520" marker-end="url(#arrowD)"/>
  <text class="num" x="430" y="510">⑤</text>
  <text class="rl" x="428" y="500">Stream</text>
  <line class="edge" x1="550" y1="490" x2="550" y2="520" marker-end="url(#arrow)"/>
  <text class="rl" x="556" y="510">令牌态</text>
  <line class="edge" x1="264" y1="488" x2="634" y2="520" marker-end="url(#arrow)"/>
  <text class="num" x="430" y="498">⑥</text>
  <text class="rl" x="430" y="492">S3</text>

  <!-- 图例 -->
  <rect x="180" y="584" width="490" height="36" rx="8" fill="#FFFFFF" stroke="#C9C9C9" stroke-width="0.5"/>
  <line class="edge" x1="196" y1="598" x2="226" y2="598" marker-end="url(#arrow)"/>
  <text class="leg" x="230" y="602">实线 = 同步调用（REST / WS / JDBC / S3）</text>
  <line class="edgeD" x1="196" y1="612" x2="226" y2="612" marker-end="url(#arrowD)"/>
  <text class="leg" x="230" y="616">虚线 = 异步（Redis Stream 集群广播）</text>
</svg>
