<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LinkMate Agent E2E Harness</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      nav {
        display: flex;
        gap: 8px;
        padding: 12px;
      }
      nav button {
        padding: 8px 12px;
      }
      .chat-list {
        list-style: none;
        padding: 0;
        margin: 12px;
      }
      .chat-list li {
        padding: 10px;
        border: 1px solid #ddd;
        margin-bottom: 6px;
      }
      .chat-list li.active {
        background: #e8f4ff;
      }
      .message-input textarea {
        width: 300px;
        height: 60px;
      }
    </style>
  </head>
  <body>
    <h1 data-testid="harness-title">LinkMate Agent DOM Harness</h1>
    <nav>
      <button type="button" data-lm-nav="chat">聊天</button>
      <button type="button" data-lm-nav="calendar">日历</button>
      <button type="button" data-lm-nav="favorites">收藏</button>
    </nav>
    <ul class="chat-list">
      <li data-lm-session-id="101" data-lm-session-name="张三" class="active">张三</li>
      <li data-lm-session-id="201" data-lm-session-name="项目群">项目群</li>
      <li data-lm-session-id="203" data-lm-session-name="技术交流群">技术交流群</li>
    </ul>
    <div class="message-input">
      <textarea data-lm-chat-input data-testid="chat-input"></textarea>
    </div>
    <button type="button" class="lx-btn--send" data-lm-send-btn data-testid="send-btn">发送</button>
    <div class="panel-search-bar">
      <input class="search-input" data-lm-search-bar data-testid="search-bar" />
    </div>
    <button type="button" data-lm-calendar-add data-testid="calendar-add">新建日程</button>
    <button type="button" data-lm-favorites-add data-testid="favorites-add">新建笔记</button>
  </body>
</html>
