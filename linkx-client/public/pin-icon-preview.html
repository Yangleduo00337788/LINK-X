<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkX 置顶图标选型</title>
  <style>
    :root {
      --bg: #f0f0f0;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #12b7f5;
      --border: #e5e5e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 24px; font-size: 14px; line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .card h2 {
      font-size: 15px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag {
      font-size: 11px;
      color: var(--muted);
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .desc {
      font-size: 13px;
      color: var(--muted);
      margin: 8px 0 16px;
      line-height: 1.5;
    }
    .preview-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .preview-row.dark {
      background: #2d2d2d;
      color: #fff;
    }
    .preview-label {
      font-size: 12px;
      color: var(--muted);
      min-width: 72px;
    }
    .preview-row.dark .preview-label { color: #aaa; }
    .caption-mock {
      display: flex;
      align-items: stretch;
      height: 40px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .caption-mock .btn {
      width: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #333;
    }
    .caption-mock .btn.active { color: var(--accent); background: rgba(18,183,245,.12); }
    .caption-mock .btn + .btn { border-left: 1px solid var(--border); }
    .caption-mock .fake { width: 10px; height: 10px; background: #333; opacity: .35; border-radius: 1px; }
    .caption-mock .fake.line { height: 1px; width: 10px; }
    .caption-mock .fake.square { border: 1px solid #333; background: transparent; }
    .list-mock {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .list-mock .time { font-size: 12px; color: #999; margin-left: auto; }
    code.pick { font-size: 12px; background: #eef9ff; color: #0a7ab8; padding: 2px 6px; border-radius: 4px; }
    footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
    svg { display: block; }
  </style>
</head>
<body>
  <h1>置顶图标选型对比</h1>
  <p class="lead">
    在浏览器打开本页：<code>linkx-client/public/pin-icon-preview.html</code>（或 dev 时访问
    <code>/pin-icon-preview.html</code>）。看完告诉我要用哪一个编号（A–F），我再换进客户端。
  </p>

  <div class="grid" id="grid"></div>

  <footer>
    来源说明：A 为当前实现；B/C 来自 Google Material Icons；D 来自 Ionicons；E 参考 Telegram 会话列表；F 来自 Heroicons 推钉造型。
    窗控区统一 10px，列表区 10–12px，线宽约 1.1px。
  </footer>

  <script>
    const icons = [
      {
        id: 'A',
        name: '当前 · 三角头竖针（图二）',
        source: 'LinkX 当前',
        use: '窗口置顶 + 列表',
        desc: '三角钉头 + 横杠 + 竖针。与最小化/最大化线框一致，正面视角。',
        svg10: `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.4 6.55 3.3H3.45L5 1.4Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M3.2 3.72H6.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M5 3.72V7.3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><circle cx="5" cy="7.62" r="0.55" fill="currentColor"/></svg>`,
        svg10Active: true
      },
      {
        id: 'B',
        name: 'Material · push_pin 线框',
        source: 'Google Material Icons',
        use: 'IM/办公类常见',
        desc: '扁横钉头 + 粗竖针 + 底部双叉脚。认知度高，略占宽度。',
        svg10: `<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z" transform="scale(0.42) translate(1,1)"/></svg>`
      },
      {
        id: 'C',
        name: 'Material · push_pin 实心',
        source: 'Google Material Icons',
        use: '激活态 / 列表标记',
        desc: '与 B 同造型，实心填充。置顶激活时更清晰。',
        svg10: `<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z" transform="scale(0.42) translate(1,1)"/></svg>`,
        svg10Active: true
      },
      {
        id: 'D',
        name: 'Ionicons · pin-outline',
        source: 'Ionicons 5',
        use: 'Telegram / 移动端',
        desc: '倾斜推钉，圆角钉头 + 斜针。小尺寸下较圆润。',
        svg10: `<svg width="10" height="10" viewBox="0 0 512 512" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"><path d="M336 112a80 80 0 0 0-160 0v96"/><path d="M176 112v-16a48.14 48.14 0 0 1 96 0v16"/><path d="M336 208v32a80 80 0 0 1-160 0v-32"/><path d="M176 240v64"/><path d="M320 240v64"/><line x1="256" y1="304" x2="256" y2="432"/></svg>`
      },
      {
        id: 'E',
        name: 'Telegram 风格 · 小灰钉',
        source: 'Telegram Desktop 会话列表',
        use: '仅列表右侧标记',
        desc: '极简倾斜钉，无多余细节。Telegram 在未读角标旁使用 muted 色小钉。',
        svg10: `<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><g transform="rotate(-35 6 6)"><path d="M7.2 2.4a1 1 0 0 0-1.4 0L4.6 4.6a1 1 0 0 0 0 1.4l.4.4-1.3 2.2a.35.35 0 0 0 .44.54l2.2-1.3.4.4a1 1 0 0 0 1.4 0l1.8-1.8a1 1 0 0 0 0-1.4L7.2 2.4Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M5.4 6.6 4.2 8.8" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="4.2" cy="8.8" r="0.45" fill="currentColor"/></g></svg>`
      },
      {
        id: 'F',
        name: 'Heroicons · 倾斜推钉',
        source: 'Heroicons / Tailwind UI',
        use: '现代桌面应用',
        desc: '45° 推钉造型，钉头略方。Discord/Notion 类后台常见。',
        svg10: `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 1 5 15.24V16a2 2 0 0 1-2 2H2"/><path d="M15 10.76a2 2 0 0 0 1.11 1.79l1.78.9A2 2 0 0 0 21 15.24V16a2 2 0 0 0 2 2h1"/><path d="m8 11.8-3.1 6.3c-.3.7.4 1.4 1.1 1.1l6.3-3.1"/><path d="m16 11.8 3.1 6.3c.3.7-.4 1.4-1.1 1.1l-6.3-3.1"/></svg>`
      }
    ]

    function card(icon) {
      const activeClass = icon.svg10Active ? 'active' : ''
      const pinSvg = icon.svg10
      return `
        <article class="card">
          <h2><span>${icon.id}</span> ${icon.name} <span class="tag">${icon.source}</span></h2>
          <p class="desc">${icon.desc}<br>推荐场景：${icon.use}</p>
          <div class="preview-row">
            <span class="preview-label">窗控 10px</span>
            <div class="caption-mock">
              <div class="btn ${activeClass}">${pinSvg}</div>
              <div class="btn"><div class="fake line"></div></div>
              <div class="btn"><div class="fake square"></div></div>
              <div class="btn"><div class="fake" style="transform:rotate(45deg);width:8px;height:8px;background:transparent;border:1px solid #333"></div></div>
            </div>
          </div>
          <div class="preview-row">
            <span class="preview-label">列表 12px</span>
            <div class="list-mock">
              <span>小白</span>
              <span style="opacity:.7">${pinSvg.replace('width="10"','width="12"').replace('height="10"','height="12"')}</span>
              <span class="time">17:41</span>
            </div>
          </div>
          <div class="preview-row dark">
            <span class="preview-label">深色底</span>
            <div class="caption-mock" style="background:#2d2d2d;border-color:#444">
              <div class="btn ${activeClass}" style="color:#fff">${pinSvg}</div>
            </div>
          </div>
          <p>回复时用：<code class="pick">选 ${icon.id}</code></p>
        </article>`
    }

    document.getElementById('grid').innerHTML = icons.map(card).join('')
  </script>
</body>
</html>
