<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 外链图（CDN 防盗链）不带 Referer；API 鉴权不依赖 Referer -->
    <meta name="referrer" content="no-referrer" />
    <title>LinkX</title>
    <style>
      /* 首屏关键样式：在 Vite 打包 JS/CSS 到达前先铺底，避免 Electron 透明窗白闪 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      #app {
        min-height: 100%;
        border-radius: 20px;
        overflow: hidden;
        clip-path: inset(0 round 20px);
        background: linear-gradient(
          165deg,
          #d8ecfb 0%,
          #e8f3fc 38%,
          #f4f7fb 72%,
          #fafbfd 100%
        );
      }
      /* 静态启动占位：与 Electron 窗口圆角一致（20px） */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(
          165deg,
          #d8ecfb 0%,
          #e8f3fc 38%,
          #f4f7fb 72%,
          #fafbfd 100%
        );
        border-radius: 20px;
        overflow: hidden;
        clip-path: inset(0 round 20px);
        transition: opacity 0.2s ease;
      }
      html.app-ready #boot-splash {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(18, 183, 245, 0.18);
      }
      #boot-splash .boot-label {
        font-size: 15px;
        font-weight: 600;
        color: #1a2332;
        letter-spacing: 0.04em;
      }
      /* 启动占位不展示转圈，避免与登录页重复；Vue 首屏就绪后由 dismissBootSplash 移除 */
      #boot-splash .boot-error {
        max-width: 260px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #fff1f0;
        color: #cf1322;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/apple-touch-icon.png" alt="" width="72" height="72" />
      <div class="boot-label">LinkX</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
