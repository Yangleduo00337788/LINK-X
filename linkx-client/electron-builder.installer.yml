# 作者：yangleduo
appId: com.linkx.installer
productName: LinkX Installer
extraMetadata:
  main: dist-installer-electron/main/main.js
directories:
  output: release/installer
  buildResources: build
files:
  - dist-installer/**/*
  - dist-installer-electron/**/*
  - '!dist-installer-electron/package.json'
extraResources:
  - from: .installer-payload
    to: app-payload
    filter:
      - '**/*'
  - from: build/icon.ico
    to: icon.ico
  - from: release/uninstaller
    to: uninstaller
    filter:
      - 'Uninstall LinkX.exe'
win:
  target:
    - portable
  icon: build/icon.ico
  signExecutable: false
  signAndEditExecutable: false
artifactName: LinkX-Installer-${version}.${ext}
