<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft gray gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2f2f2"/>
      <stop offset="50%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#d4d4d4"/>
    </linearGradient>

    <!-- Letter stroke gradient: dark charcoal -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>

    <!-- Subtle shadow for depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00000030"/>
    </filter>

    <!-- Inner highlight on background -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- === BACKGROUND: Rounded square === -->
  <!-- Outer shadow layer -->
  <rect x="36" y="36" width="440" height="440" rx="112" ry="112"
        fill="#c8c8c8" opacity="0.4" transform="translate(6, 10)"/>

  <!-- Main background -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108"
        fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Inner ring decoration -->
  <rect x="52" y="52" width="408" height="408" rx="96" ry="96"
        fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- Top-left highlight reflection -->
  <rect x="52" y="52" width="408" height="204" rx="96" ry="96"
        fill="url(#innerHighlight)" opacity="0.5"/>

  <!-- === LETTER L: Thick rounded path === -->
  <!-- Vertical bar: top-left to bottom -->
  <path d="M 148 128
           L 148 320
           Q 148 358 186 358
           L 226 358"
        stroke="url(#letterGrad)"
        stroke-width="58"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- === LETTER X: Two crossing diagonal strokes === -->
  <!-- Diagonal 1: top-right to bottom-left -->
  <path d="M 252 128
           L 340 340
           Q 354 366 340 380
           Q 326 394 300 380
           L 224 322"
        stroke="url(#letterGrad)"
        stroke-width="58"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Diagonal 2: top-left to bottom-right (crosses the first) -->
  <path d="M 376 128
           L 248 316"
        stroke="url(#letterGrad)"
        stroke-width="58"
        stroke-linecap="round"
        fill="none"/>

  <!-- === CUTE DETAILS === -->

  <!-- Highlight dot on L's top (like a little star/sparkle) -->
  <circle cx="148" cy="128" r="14" fill="#12b7f5" opacity="0.9"/>
  <circle cx="148" cy="128" r="8" fill="#ffffff" opacity="0.8"/>

  <!-- Highlight dot on X's right arm -->
  <circle cx="376" cy="128" r="11" fill="#12b7f5" opacity="0.85"/>
  <circle cx="376" cy="128" r="6" fill="#ffffff" opacity="0.7"/>

  <!-- Small sparkle on the X intersection area -->
  <circle cx="296" cy="232" r="10" fill="#12b7f5" opacity="0.7"/>
  <circle cx="296" cy="232" r="5" fill="#ffffff" opacity="0.9"/>

  <!-- Bottom-right corner dot -->
  <circle cx="340" cy="380" r="8" fill="#12b7f5" opacity="0.6"/>
  <circle cx="340" cy="380" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- L corner dot -->
  <circle cx="226" cy="358" r="7" fill="#12b7f5" opacity="0.6"/>
  <circle cx="226" cy="358" r="3.5" fill="#ffffff" opacity="0.8"/>

</svg>
