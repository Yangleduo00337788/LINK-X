<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>LinkX 管理后台</title>
    <script>
      try {
        var raw = localStorage.getItem('linkx-admin-preferences')
        if (raw) {
          var p = JSON.parse(raw)
          var appearance = p.appearancePreset
          var theme = p.theme
          if (appearance === 'dark') theme = 'dark'
          else if (appearance === 'light' || appearance === 'mixed') theme = 'light'
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme)
          }
          if (appearance === 'mixed' || appearance === 'dark') {
            document.documentElement.setAttribute('data-nav-theme', 'dark')
          } else if (appearance === 'light') {
            document.documentElement.setAttribute('data-nav-theme', 'light')
          }
          if (p.layoutMode === 'side' || p.layoutMode === 'top' || p.layoutMode === 'mix') {
            document.documentElement.setAttribute('data-layout', p.layoutMode)
          }
          if (typeof p.primaryColor === 'string' && /^#[0-9a-fA-F]{6}$/.test(p.primaryColor)) {
            var c = p.primaryColor
            document.documentElement.style.setProperty('--lx-oa-blue', c)
            document.documentElement.style.setProperty('--lx-accent', c)
            document.documentElement.style.setProperty('--lx-stat-accent', c)
            var r = parseInt(c.slice(1, 3), 16)
            var g = parseInt(c.slice(3, 5), 16)
            var b = parseInt(c.slice(5, 7), 16)
            document.documentElement.style.setProperty('--lx-primary-rgb', r + ', ' + g + ', ' + b)
          }
          if (p.locale === 'zh-CN' || p.locale === 'en-US') {
            document.documentElement.lang = p.locale === 'zh-CN' ? 'zh-CN' : 'en'
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
