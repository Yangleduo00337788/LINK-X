name: Nightly load

on:
  schedule:
    - cron: '0 17 * * *' # 01:00 CST
  workflow_dispatch:
    inputs:
      run_hot_path:
        description: 'Run k6 hot-path against LOAD_* secrets'
        type: boolean
        default: false
      run_full_api:
        description: 'Run k6 full-api with INCLUDE_MUTATING=1 against LOAD_* secrets'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  k6-validate:
    name: k6 scripts validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate k6 assets
        working-directory: linkx-server/perf/k6
        run: node scripts/validate-scripts.js

  secrets-check:
    name: Check LOAD_* secrets
    runs-on: ubuntu-latest
    needs: k6-validate
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Probe secrets
        id: check
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          USER: ${{ secrets.LOAD_USER }}
          PASS: ${{ secrets.LOAD_PASS }}
        run: |
          if [ -n "$BASE_URL" ] && [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "LOAD_* secrets present"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LOAD_* secrets missing — scheduled load jobs will skip; configure LOAD_BASE_URL / LOAD_USER / LOAD_PASS"
          fi

  k6-hot-path:
    name: k6 hot-path
    runs-on: ubuntu-latest
    needs: [k6-validate, secrets-check]
    if: |
      needs.secrets-check.outputs.ready == 'true' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_hot_path)
      )
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run hot-path
        working-directory: linkx-server/perf/k6
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          USER: ${{ secrets.LOAD_USER }}
          PASS: ${{ secrets.LOAD_PASS }}
          VUS: '20'
          DURATION: '5m'
        run: k6 run scenarios/hot-path.js

  k6-full-api-readonly:
    name: k6 full-api (read-only)
    runs-on: ubuntu-latest
    needs: [k6-validate, secrets-check]
    if: |
      needs.secrets-check.outputs.ready == 'true' && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run full-api read-only
        working-directory: linkx-server/perf/k6
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          USER: ${{ secrets.LOAD_USER }}
          PASS: ${{ secrets.LOAD_PASS }}
          INCLUDE_MUTATING: '0'
          VUS: '5'
          DURATION: '2m'
        run: k6 run full-api.js

  k6-full-api:
    name: k6 full-api (mutating)
    runs-on: ubuntu-latest
    needs: [k6-validate, secrets-check]
    if: |
      needs.secrets-check.outputs.ready == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_full_api
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run full-api with writes
        working-directory: linkx-server/perf/k6
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          USER: ${{ secrets.LOAD_USER }}
          PASS: ${{ secrets.LOAD_PASS }}
          INCLUDE_MUTATING: '1'
          VUS: '5'
          DURATION: '2m'
        run: k6 run full-api.js
