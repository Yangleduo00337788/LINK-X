name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkx-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run regression suite
        run: >
          mvn -B -q
          -Dtest=MessageFlowTest,ImMainLinkE2ETest,ImWebSocketLiveE2ETest,DualClientLiveSmokeTest,AlignmentGapSmokeTest,WebSocketNormalLinkTest,MessageReliabilityFlowTest,ExceptionPathTest,P1DebtTest,P2AdvancedTest,P2QualityGateTest,P2DataGovernanceTest,ChatSearchEnhanceTest,GroupInvitationControllerTest,ChatControllerTest,AdminRoleSmokeIT,AdminSecurityIT,AdminMenuIT,AdminDataScopeIT,AdminStatisticsIT,AdminStepUpIT,AdminDeviceSecurityIT,AdminOpsConfigIT,VersionControllerTest,AppVersionUtilsTest,ProductionSecurityValidatorTest,ProductionSecretRulesTest
          test
        timeout-minutes: 45

  admin-unit:
    name: Admin unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkx-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: linkx-admin/package-lock.json
      - run: npm ci
      - run: npm test

  client-unit:
    name: Client unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkx-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: linkx-client/package-lock.json
      - run: npm ci
      - run: npm test

  client-e2e:
    name: Client E2E smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkx-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: linkx-client/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: true

  dependency-scan:
    name: SCA & SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build linkx-server
        working-directory: linkx-server
        run: mvn -B -q compile -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
