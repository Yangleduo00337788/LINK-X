# =============================================================================
# LinkX 集成测试配置（src/test/resources/application-test.yml）
# -----------------------------------------------------------------------------
# @ActiveProfiles("test") 时覆盖主 application.yml。
# 占位符由 .env.test 提供（可与 .env.local 合并，本文件优先）；CI 仅依赖 .env.test。
# =============================================================================

server:
  # 0 = 随机端口，避免并行测试或本机已有服务冲突
  port: 0
  servlet:
    # 与生产一致，MockMvc 请求仍带 /api 前缀
    context-path: /api

spring:
  datasource:
    # 内存 H2，兼容 MySQL 模式；用例结束进程即销毁
    url: jdbc:h2:mem:linkx;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # 测试用 schema.sql 建表，不跑 Flyway（迁移面向 MySQL 生产/本地）
  flyway:
    enabled: false

  sql:
    init:
      # 每次上下文启动执行 schema.sql 建表
      mode: always
      schema-locations: classpath:schema.sql

  data:
    redis:
      # 测试仍依赖真实 Redis（限流/token/属主登记等）；需本机 6379 可用
      host: 127.0.0.1
      port: 6379
      database: 0
      # 测试环境建议设置密码，此处用环境变量注入兼容本地无密码 Redis
      password: ${REDIS_PASSWORD:}

# ---------- MyBatis-Flex（测试精简）----------
mybatis-flex:
  global-config:
    logic-delete-column: deleted
    print-banner: false

# ---------- LinkX 测试业务覆盖 ----------
linkx:
  jwt:
    # 测试密钥：优先读环境变量 JWT_SECRET，未设置时用占位默认值（仅测试环境）
    # 默认值 ≥32 字符、不含 secret/password 子串以通过强度校验，勿用于真实环境
    secret: ${JWT_SECRET:Test-Local-JWT-Key-For-Integration-2026!!}
    access-expire: 7200000
    refresh-expire: 604800000

  auth:
    # 关闭验证码，简化 registerAndLogin 等测试辅助方法
    captcha-enabled: false
    login-max-attempts: 5
    lock-duration-minutes: 15
    # 放宽限流，避免批量用例触发 429
    rate-limit-login-per-minute: 1000
    rate-limit-register-per-minute: 1000

  cors:
    allowed-origins:
      - http://localhost:5173

  security:
    # 测试不走 HTTPS 强制
    require-https: false

  im:
    # -1：跳过 Netty WebSocket 绑定，避免占端口；WS 相关用例自行起 mock/嵌入式
    websocket-port: -1

  minio:
    # 测试 MinIO 凭证：优先读环境变量，未设置时用本地默认值（仅测试环境）
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket-name: linkx-test
    max-file-size: 10485760  # 10MB

  mail:
    # 指向本机假 SMTP，避免真实发信；未起服务时发送路径应被业务兜底/断言
    host: localhost
    port: 2525
    username: ""
    password: ""
    from: test@linkx.com
    from-name: LinkX-Test
    start-tls: false
    ssl: false
    code-expire-minutes: 10

# ---------- 测试日志尽量安静 ----------
logging:
  level:
    root: warn
    com.linkx.server: info
    org.springframework.security: warn
