# 作者：yangleduo
# =============================================================================
# 集成测试 profile（application-test.yml）
# -----------------------------------------------------------------------------
# 主配置 application.yml 的所有 ${占位符} 在测试环境下由此文件补齐。
# DB_URL / REDIS_HOST / REDIS_PORT 等由集成测试基类的 @DynamicPropertySource
# 注入 Testcontainers 真实容器地址，此处不写。
# =============================================================================

# 测试环境禁用 Flyway：init.sql 基线与 V2..V125 迁移存在重叠（全新部署同样会撞
# duplicate column），由 AbstractIntegrationTest 自建迁移执行器容忍幂等错误。
spring:
  flyway:
    enabled: false

SERVER_PORT: 0
TOMCAT_MAX_SWALLOW_SIZE: 2MB
TOMCAT_MAX_HTTP_FORM_POST_SIZE: 2MB
TOMCAT_MAX_PART_COUNT: 50
MULTIPART_MAX_FILE_SIZE: 20MB
MULTIPART_MAX_REQUEST_SIZE: 22MB
SPRING_PROFILES_ACTIVE: test

DB_USERNAME: linkx
DB_PASSWORD: linkx

REDIS_PASSWORD: ""
