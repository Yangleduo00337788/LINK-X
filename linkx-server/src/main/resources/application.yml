# 作者：yangleduo
# =============================================================================
# LinkX 唯一主配置（application.yml）
# -----------------------------------------------------------------------------
# 本文件只写「结构」和 ${变量名}，不写具体业务值，也不写 :default 回退。
# 所有取值来自：
#   .env.local  ← SPRING_PROFILES_ACTIVE=local
#   .env.prod   ← SPRING_PROFILES_ACTIVE=prod
# 或操作系统/容器环境变量（优先级高于 .env 文件）。
# 改 env 或本文件后需重启后端
# =============================================================================

# ---------- 内嵌 Tomcat（HTTP API）----------
server:
  port: ${SERVER_PORT}
  tomcat:
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE}
    max-http-form-post-size: ${TOMCAT_MAX_HTTP_FORM_POST_SIZE}
    max-part-count: ${TOMCAT_MAX_PART_COUNT}
  servlet:
    context-path: /api

# ---------- Spring Boot 核心 ----------
spring:
  application:
    name: linkx-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}
      minimum-idle: ${HIKARI_MIN_IDLE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
      pool-name: linkx-hikari

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: ${REDIS_TIMEOUT}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_MAX_ACTIVE}
          max-idle: ${REDIS_LETTUCE_MAX_IDLE}
          min-idle: ${REDIS_LETTUCE_MIN_IDLE}
          max-wait: ${REDIS_LETTUCE_MAX_WAIT}

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema (init.sql / prior deploys)
    validate-on-migrate: true
    encoding: UTF-8

# ---------- MyBatis-Flex ORM（结构固定）----------
mybatis-flex:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    logic-delete-column: deleted
    print-banner: false

# ---------- LinkX 业务（LinkxProperties）----------
linkx:
  jwt:
    secret: ${JWT_SECRET}
    access-expire: ${JWT_ACCESS_EXPIRE}
    refresh-expire: ${JWT_REFRESH_EXPIRE}

  auth:
    captcha-enabled: ${CAPTCHA_ENABLED}
    admin-captcha-enabled: ${ADMIN_CAPTCHA_ENABLED}
    client-captcha-type: ${CLIENT_CAPTCHA_TYPE}
    admin-captcha-type: ${ADMIN_CAPTCHA_TYPE}
    register-enabled: ${REGISTER_ENABLED}
    forgot-password-email-enabled: ${FORGOT_PASSWORD_EMAIL_ENABLED}
    login-max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS}
    admin-login-max-attempts: ${AUTH_ADMIN_LOGIN_MAX_ATTEMPTS}
    lock-duration-minutes: ${AUTH_LOCK_DURATION_MINUTES}
    admin-lock-duration-minutes: ${AUTH_ADMIN_LOCK_DURATION_MINUTES}
    admin-totp-required: ${ADMIN_TOTP_REQUIRED}
    password-min-length: ${AUTH_PASSWORD_MIN_LENGTH}
    password-max-length: ${AUTH_PASSWORD_MAX_LENGTH}
    password-require-upper-lower: ${AUTH_PASSWORD_REQUIRE_UPPER_LOWER}
    password-require-digit: ${AUTH_PASSWORD_REQUIRE_DIGIT}
    password-require-special: ${AUTH_PASSWORD_REQUIRE_SPECIAL}
    rate-limit-login-per-minute: ${AUTH_RATE_LIMIT_LOGIN}
    rate-limit-register-per-minute: ${AUTH_RATE_LIMIT_REGISTER}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  security:
    require-https: ${REQUIRE_HTTPS}

  linkmate:
    enabled: ${LINKMATE_ENABLED}
    api-key: ${LINKMATE_API_KEY}
    base-url: ${LINKMATE_BASE_URL}
    model: ${LINKMATE_MODEL}
    max-tokens: ${LINKMATE_MAX_TOKENS}
    temperature: ${LINKMATE_TEMPERATURE}
    daily-token-limit: ${LINKMATE_DAILY_TOKEN_LIMIT}
    system-prompt: ${LINKMATE_SYSTEM_PROMPT}

  message-encryption:
    enabled: ${MESSAGE_CONTENT_ENCRYPT_ENABLED}
    kek: ${MESSAGE_KEK}
    legacy-kek-map: ${MESSAGE_KEK_LEGACY_MAP}
    key-id: ${MESSAGE_KEK_KEY_ID}
    search-scan-limit: ${MESSAGE_SEARCH_SCAN_LIMIT}
    reencrypt-batch-size: ${MESSAGE_REENCRYPT_BATCH_SIZE}
    key-rotate-batch-size: ${MESSAGE_KEY_ROTATE_BATCH_SIZE}

  proxy:
    trust-proxy: ${TRUST_PROXY}

  im:
    websocket-port: ${IM_WS_PORT}

  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET_NAME}
    max-file-size: ${MINIO_MAX_FILE_SIZE}
    presign-expiry:
      avatar-seconds: ${MINIO_PRESIGN_AVATAR_SECONDS}
      file-seconds: ${MINIO_PRESIGN_FILE_SECONDS}
      share-seconds: ${MINIO_PRESIGN_SHARE_SECONDS}

  storage:
    provider: ${STORAGE_PROVIDER}

  oss:
    endpoint: ${OSS_ENDPOINT}
    bucket-name: ${OSS_BUCKET_NAME}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    cname-domain: ${OSS_CNAME_DOMAIN}

  local:
    base-path: ${LOCAL_STORAGE_PATH}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME}
    start-tls: ${MAIL_START_TLS}
    ssl: ${MAIL_SSL}
    code-expire-minutes: ${MAIL_CODE_EXPIRE_MINUTES}

  app:
    version: ${APP_VERSION}
    channel: ${APP_CHANNEL}
    release-notes: ${APP_RELEASE_NOTES}
    download-url: ${APP_DOWNLOAD_URL}
    force-update: ${APP_FORCE_UPDATE}
    min-supported-version: ${APP_MIN_SUPPORTED_VERSION}
    dev-mode-enabled: ${DEV_MODE_ENABLED}

  retention:
    message-days: ${MESSAGE_RETENTION_DAYS}

  ip-geo:
    xdb-path: ${IP_GEO_XDB_PATH}

  snail-job:
    admin-console-url: ${SNAIL_JOB_ADMIN_URL}
    sync-jobs-on-startup: ${SNAIL_JOB_SYNC_JOBS}

# ---------- SnailJob 客户端 ----------
snail-job:
  enabled: ${SNAIL_JOB_ENABLED}
  server:
    host: ${SNAIL_JOB_SERVER_HOST}
    port: ${SNAIL_JOB_SERVER_PORT}
  namespace: ${SNAIL_JOB_NAMESPACE}
  group: ${SNAIL_JOB_GROUP}
  token: ${SNAIL_JOB_TOKEN}
  host: ${SNAIL_JOB_CLIENT_HOST}
  port: ${SNAIL_JOB_CLIENT_PORT}
  openapi:
    host: ${SNAIL_JOB_OPENAPI_HOST}
    port: ${SNAIL_JOB_OPENAPI_PORT}
    prefix: snail-job

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS}
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

# ---------- OpenAPI / Swagger ----------
springdoc:
  disable-i18n: false
  allowed-locales: zh_CN,en
  api-docs:
    enabled: ${SPRINGDOC_ENABLED}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    query-config-enabled: true
  show-actuator: false

# ---------- 日志 ----------
logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.linkx.server: ${LOG_LEVEL_LINKX}
    org.springframework.security: ${LOG_LEVEL_SECURITY}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
