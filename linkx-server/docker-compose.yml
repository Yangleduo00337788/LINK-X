# 作者：yangleduo
services:
  mysql:
    image: mysql:8.4.0
    container_name: linkx-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: linkx
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/init-snail-job-db.sql:/docker-entrypoint-initdb.d/02-snail-job-db.sql:ro
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # [P2-9] 容器安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # MySQL 官方入口脚本需要以下能力：切换 mysql 用户、调整数据目录权限
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # 临时目录走 tmpfs，避免写入容器可写层
    tmpfs:
      - /tmp
    networks:
      - linkx-net
    mem_limit: 512m
    cpus: "1.0"

  redis:
    image: redis:7.2.4
    container_name: linkx-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - ./docker/redis/data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # [P2-9] 容器安全加固：以 redis 用户运行，删除所有 capabilities
    user: "redis:redis"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # [P1-D5] read_only + tmpfs：根文件系统只读，/data 为 volume 挂载不受限制
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - linkx-net
    mem_limit: 256m
    cpus: "0.5"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: linkx-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - ./docker/minio/data:/data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    # [P2-9] 容器安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # [P1-D5] read_only + tmpfs：根文件系统只读，临时目录走 tmpfs
    # /data 为 volume 挂载不受 read_only 限制
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - linkx-net
    mem_limit: 512m
    cpus: "1.0"

  snail-job:
    image: opensnail/snail-job:1.9.0
    container_name: linkx-snail-job
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:17888:17888"
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/snail_job?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linkx-net
    mem_limit: 512m
    cpus: "1.0"

  # 应用服务（默认不启动；需要时：docker compose --profile app up -d --build）
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: linkx-server:local
    container_name: linkx-app
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/linkx?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      TRUST_PROXY: "true"
      DEV_MODE_ENABLED: "false"
      SNAIL_JOB_SERVER_HOST: snail-job
      SNAIL_JOB_OPENAPI_HOST: snail-job
      SNAIL_JOB_OPENAPI_PORT: 8080
      SNAIL_JOB_ADMIN_URL: http://127.0.0.1:18080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      snail-job:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - linkx-net
    mem_limit: 1024m
    cpus: "2.0"

networks:
  linkx-net:
    driver: bridge
