# LinkX 生产环境 Nginx HTTPS 配置示例
# 用法：
#   1. 替换 YOUR_DOMAIN、证书路径、upstream 地址
#   2. 确保 Spring Boot 仅监听内网（如 127.0.0.1:8080），不对外直接暴露
#   3. Cookie 登录态需 Secure；生产务必全站 HTTPS

upstream linkx_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# WebSocket 升级（IM 推送）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/ssl/certs/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_DOMAIN/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 静态前端（Web 客户端 dist）
    root /var/www/linkx-client;
    index index.html;

    client_max_body_size 100m;

    # API + 鉴权媒体中转
    location /api/ {
        proxy_pass http://linkx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket（路径与 application.yml 中 ws 路径一致）
    location /ws/ {
        proxy_pass http://linkx_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头（可按 CSP 策略收紧）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# MinIO 不应对公网暴露预签名直链域名；对象仅经 /api 鉴权中转访问。
# 若必须经 Nginx 反代 MinIO（内网运维），单独子域 + IP 白名单，勿与主站同 Cookie 域。
